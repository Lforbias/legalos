name: Publicar no servidor
# Padrão: publicação MANUAL (Actions → Publicar no servidor → Run workflow). O clique é a aprovação.
# Para publicar sozinho depois que o CI do main ficar verde, crie a variável do repositório AUTO_DEPLOY = true
# (Settings → Secrets and variables → Actions → Variables). Apague a variável para voltar ao modo manual.
# Se o plano do GitHub permitir, o ambiente "production" também pode exigir aprovação (Required reviewers).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.AUTO_DEPLOY == 'true' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Preparar chave de acesso
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Diagnóstico da chave (não mostra segredos)
        run: |
          echo "linhas da chave: $(wc -l < ~/.ssh/deploy_key)"
          echo "primeira linha: $(head -n 1 ~/.ssh/deploy_key | cut -c1-40)"
          echo "última linha:   $(tail -n 1 ~/.ssh/deploy_key | cut -c1-40)"
          echo "impressão digital da chave:"; ssh-keygen -lf ~/.ssh/deploy_key || echo "CHAVE INVÁLIDA (formato)"
          echo "known_hosts: $(wc -l < ~/.ssh/known_hosts) linha(s), tipo: $(awk '{print $2}' ~/.ssh/known_hosts | head -n 1)"
      - name: Nomes das imagens
        id: img
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "app=$REPO/app:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "migrate=$REPO/migrate:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "cache=$REPO/cache" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir imagem do app (no GitHub, com cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.img.outputs.app }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ steps.img.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.img.outputs.cache }},mode=max
      - name: Construir imagem da migração (reaproveita o cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ steps.img.outputs.migrate }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ steps.img.outputs.cache }}
      - name: Enviar e publicar
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$(git rev-parse HEAD)"
          # o servidor baixa as imagens prontas; o token vale só enquanto este job roda e vai dentro do pacote, não na linha de comando
          mkdir -p /tmp/meta
          { echo "APP_IMAGE=${{ steps.img.outputs.app }}"; echo "MIGRATE_IMAGE=${{ steps.img.outputs.migrate }}"; echo "GHCR_USER=${{ github.actor }}"; echo "GHCR_TOKEN=${GHCR_TOKEN}"; } > /tmp/meta/.deploy-meta
          chmod 600 /tmp/meta/.deploy-meta
          git archive --format=tar HEAD > /tmp/src.tar
          tar -rf /tmp/src.tar -C /tmp/meta .deploy-meta
          gzip -c /tmp/src.tar | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes "${DEPLOY_USER:-root}@${DEPLOY_HOST}" "receive ${SHA}"
      - name: Conferir o site
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 8 https://legalossync.tech/api/ready; then echo; exit 0; fi
            sleep 6
          done
          echo "o site não respondeu a /api/ready" >&2; exit 1
