name: Publicar no servidor
# Padrão: publicação MANUAL (Actions → Publicar no servidor → Run workflow). O clique é a aprovação.
# Para publicar sozinho depois que o CI do main ficar verde, crie a variável do repositório AUTO_DEPLOY = true
# (Settings → Secrets and variables → Actions → Variables). Apague a variável para voltar ao modo manual.
# Se o plano do GitHub permitir, o ambiente "production" também pode exigir aprovação (Required reviewers).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.AUTO_DEPLOY == 'true' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Preparar chave de acesso
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Diagnóstico da chave (não mostra segredos)
        run: |
          echo "linhas da chave: $(wc -l < ~/.ssh/deploy_key)"
          echo "primeira linha: $(head -n 1 ~/.ssh/deploy_key | cut -c1-40)"
          echo "última linha:   $(tail -n 1 ~/.ssh/deploy_key | cut -c1-40)"
          echo "impressão digital da chave:"; ssh-keygen -lf ~/.ssh/deploy_key || echo "CHAVE INVÁLIDA (formato)"
          echo "known_hosts: $(wc -l < ~/.ssh/known_hosts) linha(s), tipo: $(awk '{print $2}' ~/.ssh/known_hosts | head -n 1)"
      - name: Enviar e publicar
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SHA="$(git rev-parse HEAD)"
          git archive --format=tar.gz HEAD | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes "${DEPLOY_USER:-root}@${DEPLOY_HOST}" "receive ${SHA}"
      - name: Conferir o site
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 8 https://legalossync.tech/api/ready; then echo; exit 0; fi
            sleep 6
          done
          echo "o site não respondeu a /api/ready" >&2; exit 1
