name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: legalos
          POSTGRES_PASSWORD: legalos_dev
          POSTGRES_DB: legalos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U legalos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://legalos:legalos_dev@localhost:5432/legalos_test
      TEST_DATABASE_URL: postgresql://legalos:legalos_dev@localhost:5432/legalos_test
      APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
