# Exemplo de produção em servidor próprio. Copie .env.example para .env.production e preencha ANTES de subir.
# Primeira vez:  docker compose build && docker compose up -d db && docker compose run --rm migrate && docker compose up -d app
# HTTPS: coloque um proxy reverso (Caddy/Nginx/Traefik) na frente da porta 3000; não exponha o banco.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: legalos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no ambiente}
      POSTGRES_DB: legalos
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalos"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${MIGRATE_IMAGE:-legalos-migrate:local}
    build: { context: ., target: migrate }
    profiles: ["tools"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://legalos:${POSTGRES_PASSWORD}@db:5432/legalos
    depends_on:
      db: { condition: service_healthy }

  app:
    # Publicação rápida: o GitHub já deixa a imagem pronta (APP_IMAGE/MIGRATE_IMAGE); sem essas variáveis, constrói aqui mesmo.
    image: ${APP_IMAGE:-legalos-app:local}
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://legalos:${POSTGRES_PASSWORD}@db:5432/legalos
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db: { condition: service_healthy }

  # Robô dos portais (PJe etc.): lê a fila no banco e abre o navegador. Só sobe com --profile robot (o deploy faz isso).
  robot:
    image: ${ROBOT_IMAGE:-legalos-robot:local}
    build: { context: ., target: robot }
    profiles: ["robot"]
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://legalos:${POSTGRES_PASSWORD}@db:5432/legalos
    mem_limit: 1200m
    shm_size: 256m
    depends_on:
      db: { condition: service_healthy }

volumes:
  dbdata:
  storage:
